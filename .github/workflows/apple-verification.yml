name: Apple verification

# Scope of this workflow, deliberately narrow:
#   - run the same boundary gate that passes on Windows, but on Apple's toolchain
#   - compile the SwiftUI App target for the iOS Simulator
#   - record what SystemLanguageModel reports in a CI environment
#
# It does NOT install anything on a device, does not sign, and does not claim
# that Apple Intelligence works. Those stay OPEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: "Core: gate build and test"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Boundary gate (real build + real test)
        run: python3 Tests/check_boundaries.py

      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-gate-output
          path: work/swift-build-test.log
          if-no-files-found: warn

  app:
    name: App (xcodegen + xcodebuild + simulator probe)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Show available simulator destinations
        working-directory: App
        run: xcodebuild -scheme AIDesktop -showdestinations 2>&1 | sort -u | head -40

      - name: Build the App for the iOS Simulator
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild \
            -scheme AIDesktop \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Run both probes on a simulator
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild \
            -scheme AIDesktop \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee probe.log

      # Visual probe. Separate from the generation probe, recorded separately:
      # the point is to see the app, not to infer anything from a green test.
      - name: Capture a simulator screenshot
        if: always()
        working-directory: App
        run: |
          set -euo pipefail
          UDID_PATTERN='[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}'
          DEVICE=$(xcrun simctl list devices booted | grep -oE "$UDID_PATTERN" | head -1 || true)
          if [ -z "${DEVICE:-}" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 'iPhone 17 (' | grep -oE "$UDID_PATTERN" | head -1)
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
          fi
          echo "device=$DEVICE"
          APP_PATH=$(find build/Build/Products -maxdepth 3 -name 'AIDesktop.app' | head -1)
          echo "app=$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "bundle=$BUNDLE_ID"
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          sleep 8
          mkdir -p ../screenshots
          xcrun simctl io "$DEVICE" screenshot ../screenshots/main-scene.png
          ls -l ../screenshots

      - name: Record probe results
        if: always()
        working-directory: App
        run: |
          {
            echo "### Measurement results"
            echo
            echo "A green run does **not** mean generation succeeded. Read the"
            echo "\`GENERATION result=\` line below."
            echo
            echo '```'
            grep -a -E 'PROBE |GENERATION ' probe.log || echo 'no probe lines captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshot
          path: screenshots/
          if-no-files-found: warn

      - name: Upload raw xcodebuild output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-verification-raw-output
          path: |
            App/build.log
            App/probe.log
          if-no-files-found: warn
