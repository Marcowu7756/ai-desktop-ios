# XcodeGen spec for the App target and the Apple-side probe test.
#
# Why this file instead of a committed .pbxproj: a hand-written pbxproj is easy
# to get subtly wrong and was never validated (this scaffold was written on
# Windows, with no Xcode). Generating it in CI both builds the app and tests the
# spec itself.
#
#   brew install xcodegen
#   cd App && xcodegen generate

name: AIDesktop

options:
  bundleIdPrefix: com.example.aidesktop
  deploymentTarget:
    iOS: "17.0"

packages:
  AIDesktopPackage:
    path: ..

targets:
  AIDesktop:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - Tests
    dependencies:
      - package: AIDesktopPackage
        product: ProductCore
      - package: AIDesktopPackage
        product: BrainKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AI Desktop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  AIDesktopProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AIDesktop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AIDesktop:
    build:
      targets:
        AIDesktop: all
        AIDesktopProbeTests: [test]
    test:
      targets:
        - AIDesktopProbeTests
